name: temporary-whisper-model-transfer

on:
  push:
    branches:
      - tmp-whisper-model-transfer-20261003

jobs:
  package-models:
    runs-on: ubuntu-latest
    steps:
      - name: Download smaller multilingual Whisper models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 5 --retry-delay 2             -o models/ggml-base-q5_1.bin             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin"
          curl -fL --retry 5 --retry-delay 2             -o models/ggml-tiny-q5_1.bin             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin"
          ls -lh models
          sha256sum models/*
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-fast-models
          path: models/
          compression-level: 0
          retention-days: 1
