name: Temporary Whisper model transfer

on:
  push:
    branches:
      - temp/whisper-model-transfer

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-base-q5_1.bin
          sha256sum ggml-base-q5_1.bin
          test "$(stat -c%s ggml-base-q5_1.bin)" -gt 50000000
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1-model
          path: ggml-base-q5_1.bin
          compression-level: 0
          retention-days: 1
